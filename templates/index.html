<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Chat App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Go Chat App</h1>
        </div>

        <!-- ユーザー名入力エリア -->
        <div id="login-area" class="login-area">
            <div class="login-box">
                <h2>チャットに参加</h2>
                <input type="text" id="username-input" placeholder="ユーザー名を入力してください" maxlength="20">
                <button id="join-btn">参加する</button>
            </div>
        </div>

        <!-- チャットエリア -->
        <div id="chat-area" class="chat-area" style="display: none;">
            <div class="chat-info">
                <span id="current-username"></span>としてログイン中
            </div>

            <div id="messages" class="messages"></div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="メッセージを入力..." maxlength="500">
                <button id="send-btn">送信</button>
            </div>
        </div>

        <div class="footer">
            <p>Powered by Go + WebSocket</p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
